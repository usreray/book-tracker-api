spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  config:
    # Optional git-ignored overrides for local development (see application-local.example.yml)
    import: optional:classpath:application-local.yml
  application:
    name: book-tracker-api

  # PostgreSQL database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booktracker}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours

# Server
server:
  port: 8080

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
